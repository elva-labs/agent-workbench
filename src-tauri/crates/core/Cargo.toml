[package]
name = "chord-core"
version = "1.0.0-beta.7"
license = "MIT"
description = "Chord core: ptys, git, watching, transcripts and hooks, with no window attached"
edition = "2021"

[lib]
name = "chord_core"

# The same core on another machine, spoken to over stdio.
[[bin]]
name = "chord-remote"
path = "src/bin/chord-remote.rs"

# Scratch folders for the tests of this crate and of the crates built on it.
[features]
test-support = []

[dependencies]
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
git2 = { version = "0.21", default-features = false }
notify = "8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.43", features = ["bundled"] }
base64 = "0.23"
if-addrs = "0.15"
toml_edit = "0.25"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
chord-core = { path = ".", features = ["test-support"] }
