[package]
name = "workbench-core"
version = "0.1.0"
description = "Agent Workbench core: ptys, git, watching, transcripts and hooks, with no window attached"
edition = "2021"

[lib]
name = "workbench_core"

[dependencies]
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
git2 = { version = "0.20", default-features = false }
notify = "8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
