[package]
name = "workbench-core"
version = "0.1.2"
license = "MIT"
description = "Agent Workbench core: ptys, git, watching, transcripts and hooks, with no window attached"
edition = "2021"

[lib]
name = "workbench_core"

# The same core on another machine, spoken to over stdio.
[[bin]]
name = "agent-workbench-remote"
path = "src/bin/agent-workbench-remote.rs"

[dependencies]
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
git2 = { version = "0.20", default-features = false }
notify = "8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.22"
if-addrs = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
