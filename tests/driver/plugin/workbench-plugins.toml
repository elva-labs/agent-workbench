# The source the driver tier adds as a directory: two plugins, run by node
# with nothing installed. One is here as it runs; the other's script is
# written by its build.

[[plugin]]
name = "driverboard"
path = "board"
description = "A fixture for the driver tier: one tool, one section, one page."
version = "1.2.3"
run = ["node", "main.js"]
tools = ["ping"]
sections = ["Driver board"]
view = "wide"

# The script this one runs is written by its build, so a checkout of the
# source holds none.
[[plugin]]
name = "driverbuilt"
path = "built"
description = "A fixture for the driver tier: a plugin its build writes."
version = "0.4.0"
run = ["node", "main.js"]
build = ["node", "build.mjs"]
