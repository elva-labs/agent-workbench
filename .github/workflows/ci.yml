name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The frontend as a user meets it: types, stores, and the whole app in a
  # real browser against a fake core. Platform-independent, so one runner.
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The core on every platform it ships to: formatted, lint-clean, and its
  # own tests green. Nothing here needs a display.
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # The real binary under WebKitGTK, driven over WebDriver: the pty, the
  # environment capture, git2 and the watcher, with fake agents on PATH.
  # Linux is where the renderer differs most from the browser tier.
  driver:
    name: Real app (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and driver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb openbox xdotool imagemagick
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: tauri-driver
        uses: actions/cache@v4
        id: tauri-driver
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-2
      - if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - run: npm ci
      - run: cargo build
        working-directory: src-tauri
      - run: scripts/driver.sh
        env:
          CI: true
      - name: Photograph the window
        run: scripts/smoke.sh smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: smoke.png
          retention-days: 7

  # The real binary under WebView2, through Edge WebDriver. The fake agents
  # are batch files on PATH, which is how npm installs a command there, and
  # the driver has to match the WebView2 runtime the runner has.
  driver-windows:
    name: Real app (Windows)
    runs-on: windows-latest
    # Not yet seen green: Edge WebDriver has not opened a session against
    # the app on the runner. It reports rather than blocks until it has.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: tauri-driver
        uses: actions/cache@v4
        id: tauri-driver
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-2
      - if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - name: Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          "TAURI_NATIVE_DRIVER=$PWD\edgedriver\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci
      - run: cargo build
        working-directory: src-tauri
      - run: bash scripts/driver.sh
        env:
          CI: true
