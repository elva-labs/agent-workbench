name: Release

# A version tag builds the app for every platform and opens a draft release
# with the bundles attached. Publishing the draft is a person's decision.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The daemon for the machines a project can be on, built first so every
  # app can carry them and put one on a machine that has none.
  daemon:
    name: Daemon (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the binary runs on any Linux whatever its libc.
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: daemon-${{ matrix.target }}
      - run: cargo build --release -p workbench-core --bin agent-workbench-remote --target ${{ matrix.target }}
        working-directory: src-tauri
      - run: src-tauri/target/${{ matrix.target }}/release/agent-workbench-remote version
        if: matrix.os != 'macos-latest' || matrix.target == 'aarch64-apple-darwin'
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/agent-workbench-remote
          if-no-files-found: error
          retention-days: 14
      # On the release itself too, named for the machine kind, which is
      # what the install script fetches.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp "src-tauri/target/${{ matrix.target }}/release/agent-workbench-remote" "agent-workbench-remote-${{ matrix.name }}"
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --draft --title "Agent Workbench ${GITHUB_REF_NAME}" --notes ""
          gh release upload "${GITHUB_REF_NAME}" "agent-workbench-remote-${{ matrix.name }}" --clobber

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu, so the bundles run on older glibc.
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the version the app says it is
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tauri.conf.json says $version, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Every daemon build goes into the app's resources, at the path the
      # app looks for one to send to a machine.
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          path: daemons
      - name: Bundle the daemons
        shell: bash
        run: |
          for dir in daemons/daemon-*; do
            target=${dir#daemons/daemon-}
            mkdir -p "src-tauri/resources/remote/$target"
            cp "$dir/agent-workbench-remote" "src-tauri/resources/remote/$target/"
            chmod +x "src-tauri/resources/remote/$target/agent-workbench-remote"
          done
          ls -l src-tauri/resources/remote/*

      # Builds the frontend, the core and the bundles, and attaches them to a
      # draft release for the tag. Two copies of the step: the bundler takes
      # an empty APPLE_CERTIFICATE as one to import, so the signing variables
      # are only present at all when the secret is. The secrets are the
      # organisation's: a Developer ID certificate, and an App Store Connect
      # API key for notarization.
      - name: Whether there is a signing certificate
        id: signing
        shell: bash
        run: echo "apple=${{ secrets.MACOS_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"

      # The bundler signs the app and what it built, not the daemons it
      # carries as resources, and notarization refuses a Mach-O inside the
      # app that is not signed with the same identity, hardened runtime and
      # timestamp. The two macOS daemons are signed here first, from the
      # certificate in a keychain of this step's own.
      - name: Sign the bundled macOS daemons
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/daemons.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          for daemon in src-tauri/resources/remote/darwin-*/agent-workbench-remote; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$daemon"
            codesign --verify --verbose=2 "$daemon"
          done

      # The bundler reads the notarization key from a file. The variables
      # are exported only when the key is there, so a certificate on its
      # own signs without notarizing rather than failing.
      - name: Notarization key
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        shell: bash
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -n "$NOTARY_KEY" ]]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8"
              echo "APPLE_API_KEY=$NOTARY_KEY_ID"
              echo "APPLE_API_ISSUER=$NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Build and attach (signed)
        if: steps.signing.outputs.apple == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Agent Workbench {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Unsigned: macOS asks the user to right-click and open the first time,
      # and Windows shows a SmartScreen warning.
      - name: Build and attach (unsigned)
        if: steps.signing.outputs.apple != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Agent Workbench {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # A run started by hand builds but releases nothing: the bundles are
      # kept as artifacts to try out.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bundles-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: warn
          retention-days: 14
