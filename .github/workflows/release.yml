name: Release

# A version tag runs every check on every platform, then builds the app for
# each and opens a draft release with the bundles attached. A red check on
# any platform stops the build. Publishing the draft is a person's decision.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The checks first, with the Windows and macOS jobs that a push does not
  # run: nothing is built from a tree that fails anywhere it ships to.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      other: true

  # The draft release for the tag, made once before anything is built, so
  # every job that attaches to it finds the same one. Jobs making it as
  # they went left two drafts for a tag when two of them looked at once.
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A tag with a pre-release suffix, v1.0.0-beta.1, opens a
          # pre-release, which the latest release never points at.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --draft $prerelease --title "Agent Workbench ${GITHUB_REF_NAME}" --notes ""

  # The daemon for the machines a project can be on, built first so every
  # app can carry them and put one on a machine that has none.
  daemon:
    name: Daemon (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the binary runs on any Linux whatever its libc.
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: daemon-${{ matrix.target }}
      - run: cargo build --release -p workbench-core --bin agent-workbench-remote --target ${{ matrix.target }}
        working-directory: src-tauri
      - run: src-tauri/target/${{ matrix.target }}/release/agent-workbench-remote version
        if: matrix.os != 'macos-latest' || matrix.target == 'aarch64-apple-darwin'

      # A release is signed or it is not made: a tag that finds no
      # certificate stops here rather than shipping an unsigned daemon. A
      # manual run builds unsigned, for trying the workflow out.
      - name: The certificate must be there for a release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.CERTIFICATE == ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          echo "::error::MACOS_CERTIFICATE is not available to this repository; a release is not built unsigned. Grant the organisation's signing secrets to this repository and run the tag again."
          exit 1

      # The macOS daemons carry the organisation's Developer ID, as the app
      # does, so a machine that gets one from the release or the tap runs
      # what the certificate says it is. The identity is the secret's, or
      # the one Developer ID Application identity in the certificate.
      - name: Sign
        if: runner.os == 'macOS' && env.CERTIFICATE != ''
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/daemon.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="${IDENTITY:-$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')}"
          [[ -n "$identity" ]] || { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          daemon="src-tauri/target/${{ matrix.target }}/release/agent-workbench-remote"
          codesign --force --options runtime --timestamp --sign "$identity" "$daemon"
          codesign --verify --verbose=2 "$daemon"
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/agent-workbench-remote
          if-no-files-found: error
          retention-days: 14
      # On the release itself too, named for the machine kind, which is
      # what the install script fetches.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          daemon="agent-workbench-remote-${{ matrix.name }}"
          cp "src-tauri/target/${{ matrix.target }}/release/agent-workbench-remote" "$daemon"
          for attempt in 1 2 3 4 5; do
            if gh release upload "${GITHUB_REF_NAME}" "$daemon" --clobber; then
              exit 0
            fi
            echo "the upload did not go through, trying again"
            sleep $((attempt * 20))
          done
          echo "$daemon could not be attached"
          exit 1

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu, so the bundles run on older glibc.
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # Every place that carries the version, suffix included: the app
      # refuses a daemon whose version is not its own, and the two take
      # theirs from different manifests.
      - name: The tag must match the version the app says it is
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          manifest() { sed -n 's/^version = "\([^"]*\)".*/\1/p' "$1" | head -1; }
          failed=0
          while read -r file version; do
            if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
              echo "$file says $version, the tag is ${GITHUB_REF_NAME}"
              failed=1
            fi
          done <<VERSIONS
          src-tauri/tauri.conf.json $(node -p "require('./src-tauri/tauri.conf.json').version")
          package.json $(node -p "require('./package.json').version")
          src-tauri/Cargo.toml $(manifest src-tauri/Cargo.toml)
          src-tauri/crates/core/Cargo.toml $(manifest src-tauri/crates/core/Cargo.toml)
          VERSIONS
          exit $failed

      # The MSI format takes numeric versions only, so a version with a
      # pre-release suffix ships the NSIS installer alone on Windows.
      - name: Which bundles this version builds
        id: bundles
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$RUNNER_OS" == "Windows" && "$version" == *-* ]]; then
            echo "args=--bundles nsis" >> "$GITHUB_OUTPUT"
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Every daemon build goes into the app's resources, at the path the
      # app looks for one to send to a machine.
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          path: daemons
      - name: Bundle the daemons
        shell: bash
        run: |
          for dir in daemons/daemon-*; do
            target=${dir#daemons/daemon-}
            mkdir -p "src-tauri/resources/remote/$target"
            cp "$dir/agent-workbench-remote" "src-tauri/resources/remote/$target/"
            chmod +x "src-tauri/resources/remote/$target/agent-workbench-remote"
          done
          ls -l src-tauri/resources/remote/*

      # Builds the frontend, the core and the bundles, and attaches them to a
      # draft release for the tag. Two copies of the step: the bundler takes
      # an empty APPLE_CERTIFICATE as one to import, so the signing variables
      # are only present at all when the secret is. The secrets are the
      # organisation's: a Developer ID certificate, and an App Store Connect
      # API key for notarization.
      - name: Whether there is a signing certificate
        id: signing
        shell: bash
        run: echo "apple=${{ secrets.MACOS_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"

      # A release is signed or it is not made: a tag that finds no
      # certificate stops here, on every platform, rather than attaching
      # unsigned bundles to the draft. A manual run builds unsigned, for
      # trying the workflow out.
      - name: The certificate must be there for a release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.apple != 'true'
        shell: bash
        run: |
          echo "::error::MACOS_CERTIFICATE is not available to this repository; a release is not built unsigned. Grant the organisation's signing secrets to this repository and run the tag again."
          exit 1

      # The bundler signs the app and what it built, not the daemons it
      # carries as resources, and notarization refuses a Mach-O inside the
      # app that is not signed with the same identity, hardened runtime and
      # timestamp. The two macOS daemons are signed here first, from the
      # certificate in a keychain of this step's own, with the identity the
      # secret names or the one Developer ID Application identity in the
      # certificate, which the bundler then signs the app with.
      - name: Sign the bundled macOS daemons
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/daemons.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="${IDENTITY:-$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')}"
          [[ -n "$identity" ]] || { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          for daemon in src-tauri/resources/remote/darwin-*/agent-workbench-remote; do
            codesign --force --options runtime --timestamp --sign "$identity" "$daemon"
            codesign --verify --verbose=2 "$daemon"
          done

      # The bundler reads the notarization key from a file. The secret holds
      # the key as the PEM itself or as base64 of it, and either is written
      # out as the PEM. The variables are exported only when the key is
      # there, so a certificate on its own signs without notarizing rather
      # than failing.
      - name: Notarization key
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        shell: bash
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -n "$NOTARY_KEY" ]]; then
            key="$RUNNER_TEMP/notary.p8"
            if printf '%s' "$NOTARY_KEY" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$NOTARY_KEY" > "$key"
            else
              printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
            fi
            grep -q "BEGIN PRIVATE KEY" "$key" || { echo "NOTARY_KEY is neither a PEM key nor base64 of one"; exit 1; }
            [[ -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]] || { echo "NOTARY_KEY needs NOTARY_KEY_ID and NOTARY_ISSUER_ID with it"; exit 1; }
            {
              echo "APPLE_API_KEY_PATH=$key"
              echo "APPLE_API_KEY=$NOTARY_KEY_ID"
              echo "APPLE_API_ISSUER=$NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Build (signed)
        if: steps.signing.outputs.apple == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
        with:
          args: --target ${{ matrix.target }} ${{ steps.bundles.outputs.args }}

      # Unsigned: macOS asks the user to right-click and open the first time,
      # and Windows shows a SmartScreen warning.
      - name: Build (unsigned)
        if: steps.signing.outputs.apple != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ steps.bundles.outputs.args }}

      # The bundles are attached here and not by the build action: that
      # action uploads each asset once, so an upload the API refuses loses a
      # build that is already done, and running it again meets the assets
      # the attempt before it managed. The names carry dots where the app's
      # name has spaces, which is what the tap asks for.
      - name: Attach the bundles
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p attach
          for file in \
            "$bundle"/dmg/"$product"*.dmg \
            "$bundle"/macos/"$product"*.app.tar.gz* \
            "$bundle"/appimage/"$product"*.AppImage* \
            "$bundle"/deb/"$product"*.deb* \
            "$bundle"/rpm/"$product"*.rpm* \
            "$bundle"/msi/"$product"*.msi* \
            "$bundle"/nsis/"$product"*.exe*; do
            cp "$file" "attach/$(basename "$file" | tr ' ' '.')"
          done
          ls -l attach
          if [ -z "$(ls -A attach)" ]; then
            echo "the build left no bundles to attach"
            exit 1
          fi
          # A retry, because the upload meets the API and the API has bad
          # minutes; --clobber so an attempt after a half-finished one
          # replaces what it left.
          for attempt in 1 2 3 4 5; do
            if gh release upload "${GITHUB_REF_NAME}" attach/* --clobber; then
              exit 0
            fi
            echo "the upload did not go through, trying again"
            sleep $((attempt * 20))
          done
          echo "the bundles could not be attached"
          exit 1

      # A run started by hand builds but releases nothing: the bundles are
      # kept as artifacts to try out.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bundles-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: warn
          retention-days: 14
